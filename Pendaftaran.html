<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Praktikum - Pendaftaran</title>
</head>
<body>

    <!-- Navigasi -->
    <a href="index.html">Beranda</a> | 
    <a href="pendaftaran.html">Pendaftaran</a>
    <hr>

    <!-- Judul -->
    <h2>Form Pendaftaran Praktikan</h2>

    <!-- Formulir -->
    <form action="" method="post">
        <table>
            <tr>
                <td>Nama Lengkap</td>
                <td>: <input type="text" name="nama"></td>
            </tr>
            <tr>
                <td>Password</td>
                <td>: <input type="password" name="pass"></td>
            </tr>
            <tr>
                <td>NIM</td>
                <td>: <input type="number" name="nim"></td>
            </tr>
            <tr>
                <td>Tanggal Lahir</td>
                <td>: <input type="date" name="tgl"></td>
            </tr>
            <tr>
                <td>Jenis Kelamin</td>
                <td>: 
                    <input type="radio" name="jk" value="L" id="jk_l">
                    <label for="jk_l">Laki-Laki</label>
                    <input type="radio" name="jk" value="P" id="jk_p">
                    <label for="jk_p">Perempuan</label>
                </td>
            </tr>
            <tr>
                <td>Minat bidang</td>
                <td>: 
                    <input type="checkbox" name="minat" value="web" id="minat_web">
                    <label for="minat_web">Web</label>
                    <input type="checkbox" name="minat" value="network" id="minat_net">
                    <label for="minat_net">Jaringan</label>
                    <input type="checkbox" name="minat" value="Design/Modeling" id="minat_design">
                    <label for="minat_design">Design/Modeling</label>
                </td>
            </tr>
            <tr>
                <td>Program Studi</td>
                <td>: 
                    <select name="prodi">
                        <option value="IF">S1 Teknik Informatika</option>
                        <option value="SI">S1 Sistem Informasi</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Alasan Mendaftar</td>
                <td>: <textarea name="alasan" rows="3" cols="20"></textarea></td>
            </tr>
            <tr>
                <td></td>
                <td> 
                    <input type="submit" value="Kirim">
                    <input type="reset" value="Reset">
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
